# Disposable human-only pilot. Ports: TCP 47989 (control), TCP 47990 (web UI),
# TCP 47984 and UDP 47998-48000 are used by Sunshine clients as applicable.
# Keep host publication on an explicit LAN IPv4; the container listens on its
# private IPv6 interface and disables automatic port mapping.
# The pilot container is IPv6-only; Docker host publication is fenced separately
# to an explicit private IPv4 interface (WAR_PILOT_BIND_ADDRESS).
address = ::
port = 47989
upnp = disabled
hevc_mode = 0
av1_mode = 0
resolution = [1280x720]
fps = [30]
