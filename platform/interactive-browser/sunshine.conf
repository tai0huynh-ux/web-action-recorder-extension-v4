# Disposable human-only pilot. Ports: TCP 47989 (control), TCP 47990 (web UI),
# TCP 47984 and UDP 47998-48000 are used by Sunshine clients as applicable.
# Sunshine 0.23.1 uses an IPv6 dual-stack socket for "both". Docker publishes
# that socket only on the explicit LAN IPv4 interface (WAR_PILOT_BIND_ADDRESS).
address_family = both
port = 47989
upnp = disabled
hevc_mode = 0
av1_mode = 0
resolutions = [1280x720]
fps = [30]
