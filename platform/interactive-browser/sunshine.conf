# Disposable human-only pilot. Ports: TCP 47989 (control), TCP 47990 (web UI),
# TCP 47984 and UDP 47998-48000 are used by Sunshine clients as applicable.
# Sunshine listens only on the container's private internal IPv4 ingress bridge.
# Chrome Internet egress remains on the separate IPv6-only macvlan network.
address_family = ipv4
port = 47989
upnp = disabled
hevc_mode = 0
av1_mode = 0
resolutions = [1280x720]
fps = [30]
