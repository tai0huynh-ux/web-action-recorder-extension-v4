services:
  interactive-chrome-pilot:
    build:
      context: ../..
      dockerfile: platform/interactive-browser/Dockerfile
      args:
        CHROME_VERSION: ${WAR_PILOT_CHROME_VERSION:-151.0.7922.108-1}
        CHROME_DEB_SHA256: ${WAR_PILOT_CHROME_DEB_SHA256:-bfb6e6d345055eb481a50db423256fa2732ce010f785a56c327e213a638efdef}
        SUNSHINE_VERSION: ${WAR_PILOT_SUNSHINE_VERSION:-0.23.1}
        SUNSHINE_DEB_SHA256: ${WAR_PILOT_SUNSHINE_DEB_SHA256:-b60f9c829b8c08a05a0de34c82c4a720c773fd6941d889eaceb8b3df9f57286d}
    image: war-interactive-chrome-pilot:0.1.0
    shm_size: "1gb"
    environment:
      DISPLAY: :99
      CHROME_BIN: /usr/bin/google-chrome
      SUNSHINE_BIN: /usr/bin/sunshine
      SUNSHINE_CONFIG: /etc/sunshine/sunshine.conf
      PROFILE_DIR: /data/chrome-profile
      WIDTH: ${WAR_PILOT_WIDTH:-1280}
      HEIGHT: ${WAR_PILOT_HEIGHT:-720}
      WAR_PILOT_NO_SANDBOX: ${WAR_PILOT_NO_SANDBOX:-0}
    volumes:
      - pilot-data:/data
    # Optional runtime-only acceleration/input devices; no host packages are installed.
    # devices:
    #   - /dev/dri/renderD128:/dev/dri/renderD128
    #   - /dev/uinput:/dev/uinput
    ports:
      - "${WAR_PILOT_BIND_ADDRESS:-192.168.1.201}:47989:47989/tcp"
      - "${WAR_PILOT_BIND_ADDRESS:-192.168.1.201}:47990:47990/tcp"
      - "${WAR_PILOT_BIND_ADDRESS:-192.168.1.201}:47984:47984/tcp"
      - "${WAR_PILOT_BIND_ADDRESS:-192.168.1.201}:48010:48010/tcp"
      - "${WAR_PILOT_BIND_ADDRESS:-192.168.1.201}:47998-48000:47998-48000/udp"
    networks:
      - pilot-ingress
      - pilot-external

volumes:
  pilot-data:

networks:
  pilot-ingress:
    driver: bridge
    internal: true
  pilot-external:
    name: ${WAR_PILOT_NETWORK_NAME:-war-interactive-ipv6}
    external: true
